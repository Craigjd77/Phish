<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 Phish Setlist Explorer - Interactive Audio Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.24/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            background: linear-gradient(45deg, #1a1a2e, #16213e, #0f3460, #533a7d);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            color: #fff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #feca57);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textGradient 6s ease infinite;
            text-align: center;
            margin-bottom: 2rem;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        @keyframes textGradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .controls-panel {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-group label {
            font-weight: 600;
            color: #4ecdc4;
        }

        .control-group select, .control-group input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-family: 'Exo 2', sans-serif;
        }

        .control-group select:focus, .control-group input:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
        }

        .audio-toggle {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .audio-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .visualizer {
            display: flex;
            gap: 3px;
            align-items: end;
            height: 40px;
        }

        .bar {
            width: 4px;
            background: linear-gradient(to top, #ff6b6b, #4ecdc4);
            animation: visualize 1s ease-in-out infinite;
            border-radius: 2px;
        }

        .bar:nth-child(1) { animation-delay: 0s; height: 15px; }
        .bar:nth-child(2) { animation-delay: 0.1s; height: 25px; }
        .bar:nth-child(3) { animation-delay: 0.2s; height: 20px; }
        .bar:nth-child(4) { animation-delay: 0.3s; height: 30px; }
        .bar:nth-child(5) { animation-delay: 0.4s; height: 18px; }
        .bar:nth-child(6) { animation-delay: 0.5s; height: 28px; }

        @keyframes visualize {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.3); }
        }

        #setlists_wrapper {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #setlists {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: transparent;
        }

        #setlists thead {
            background: linear-gradient(45deg, #2c3e50, #34495e);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        #setlists th {
            padding: 15px 12px;
            color: #fff;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: none;
            font-family: 'Orbitron', monospace;
        }

        #setlists td {
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        #setlists tbody tr:hover {
            background: rgba(78, 205, 196, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .song-name {
            cursor: pointer;
            color: #4ecdc4;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
        }

        .song-name:hover {
            color: #ff6b6b;
            transform: scale(1.05);
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        .song-name.playing {
            color: #feca57;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .audio-indicator {
            position: absolute;
            top: -5px;
            right: -15px;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            border-radius: 50%;
            animation: pulse 1s ease-in-out infinite;
        }

        .stats-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #4ecdc4;
            font-family: 'Orbitron', monospace;
        }

        .stat-label {
            color: #b8c6db;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .floating-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 1000;
            min-width: 300px;
            transform: translateY(100px);
            transition: all 0.3s ease;
        }

        .floating-player.active {
            transform: translateY(0);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .play-btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .play-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
        }

        .song-info {
            flex: 1;
        }

        .song-title {
            font-weight: 600;
            color: #4ecdc4;
        }

        .song-details {
            font-size: 0.8rem;
            color: #b8c6db;
        }

        .waveform {
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }

        .wave {
            position: absolute;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to top, #ff6b6b, #4ecdc4);
            animation: wave 2s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { height: 20%; }
            50% { height: 80%; }
        }

        .search-highlight {
            background: linear-gradient(45deg, #feca57, #ff6b6b);
            padding: 2px 6px;
            border-radius: 4px;
            color: #1a1a2e;
            font-weight: 600;
        }

        .dataTables_wrapper .dataTables_filter input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            margin-left: 10px;
        }

        .dataTables_wrapper .dataTables_filter input:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 10px rgba(78, 205, 196, 0.5);
        }

        .dataTables_wrapper .dataTables_length select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 8px;
            color: #fff;
        }

        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_paginate {
            color: #b8c6db;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff !important;
            border-radius: 5px;
            margin: 0 2px;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button:hover {
            background: rgba(78, 205, 196, 0.3) !important;
            border-color: #4ecdc4 !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4) !important;
            border-color: #4ecdc4 !important;
        }

        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .controls-panel { flex-direction: column; align-items: stretch; }
            .floating-player { 
                right: 10px; 
                left: 10px; 
                min-width: auto; 
            }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }

        .setlist-cell {
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .jam-indicator {
            color: #feca57;
            font-weight: bold;
        }

        .encore-header {
            color: #ff6b6b;
            font-weight: bold;
            text-transform: uppercase;
        }

        .set-header {
            color: #4ecdc4;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <div class="container">
        <h1>🎵 Phish Setlist Explorer</h1>
        
        <div class="controls-panel">
            <div class="control-group">
                <label for="yearFilter">Year:</label>
                <select id="yearFilter">
                    <option value="">All Years</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="venueFilter">Venue:</label>
                <input type="text" id="venueFilter" placeholder="Search venues...">
            </div>
            
            <button class="audio-toggle" id="audioToggle">
                <i class="fas fa-volume-up"></i>
                Enable Audio
            </button>
            
            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <div class="stats-panel">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalShows">0</div>
                    <div class="stat-label">Total Shows</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalSongs">0</div>
                    <div class="stat-label">Unique Songs</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="yearSpan">0</div>
                    <div class="stat-label">Years Active</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalVenues">0</div>
                    <div class="stat-label">Venues Played</div>
                </div>
            </div>
        </div>

        <table id="setlists" class="display">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Venue</th>
                    <th>Location</th>
                    <th>Setlist</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be loaded here by JavaScript -->
            </tbody>
        </table>
    </div>

    <div class="floating-player" id="floatingPlayer">
        <div class="player-controls">
            <button class="play-btn" id="playBtn">
                <i class="fas fa-play"></i>
            </button>
            <div class="song-info">
                <div class="song-title" id="currentSong">No song selected</div>
                <div class="song-details" id="songDetails">Click on a song to hear a preview</div>
            </div>
        </div>
        <div class="waveform" id="waveform"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.24/js/jquery.dataTables.min.js"></script>
    <script>
        // Global variables
        let setlistData = [];
        let dataTable;
        let audioContext;
        let currentOscillator;
        let isPlaying = false;
        let audioEnabled = false;
        let currentSong = null;

        // Song frequency mappings for procedural audio
        const songFrequencies = {
            'You Enjoy Myself': [440, 554.37, 659.25],
            'Fluffhead': [329.63, 415.30, 523.25],
            'David Bowie': [293.66, 369.99, 440],
            'Harry Hood': [261.63, 329.63, 392],
            'Possum': [220, 277.18, 329.63],
            'Wilson': [185, 220, 261.63],
            'Tweezer': [147, 185, 220],
            'Mike\'s Song': [196, 246.94, 293.66],
            'Weekapaug Groove': [146.83, 185, 220],
            'Run Like an Antelope': [164.81, 207.65, 246.94],
            'Slave to the Traffic Light': [174.61, 220, 261.63],
            'Chalk Dust Torture': [246.94, 311.13, 369.99],
            'Bouncing Around the Room': [392, 493.88, 587.33],
            'Reba': [207.65, 261.63, 311.13],
            'The Divided Sky': [329.63, 415.30, 493.88],
            'Stash': [155.56, 196, 233.08],
            'Bathtub Gin': [220, 277.18, 329.63],
            'Maze': [164.81, 207.65, 246.94],
            'Julius': [174.61, 220, 261.63],
            'Sample in a Jar': [196, 246.94, 293.66],
            'Character Zero': [164.81, 207.65, 246.94],
            'Free': [174.61, 220, 261.63],
            'Ghost': [130.81, 164.81, 196],
            'Birds of a Feather': [146.83, 185, 220],
            'Down with Disease': [155.56, 196, 233.08]
        };

        // Initialize audio context
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Create stars background
        function createStars() {
            const starsContainer = document.getElementById('stars');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                starsContainer.appendChild(star);
            }
        }

        // Generate waveform visualization
        function generateWaveform() {
            const waveform = document.getElementById('waveform');
            waveform.innerHTML = '';
            
            for (let i = 0; i < 100; i++) {
                const wave = document.createElement('div');
                wave.className = 'wave';
                wave.style.left = i + '%';
                wave.style.animationDelay = (i * 0.05) + 's';
                wave.style.height = Math.random() * 80 + 20 + '%';
                waveform.appendChild(wave);
            }
        }

        // Play procedural audio for a song
        function playSong(songName) {
            if (!audioEnabled || !audioContext) return;

            stopCurrentSong();
            
            const frequencies = songFrequencies[songName] || [440, 554.37, 659.25];
            const gainNode = audioContext.createGain();
            gainNode.connect(audioContext.destination);
            gainNode.gain.value = 0.1;

            // Create multiple oscillators for harmony
            frequencies.forEach((freq, index) => {
                const osc = audioContext.createOscillator();
                const oscGain = audioContext.createGain();
                
                osc.type = ['sine', 'square', 'triangle'][index % 3];
                osc.frequency.setValueAtTime(freq, audioContext.currentTime);
                
                // Add vibrato
                const vibrato = audioContext.createOscillator();
                const vibratoGain = audioContext.createGain();
                vibrato.frequency.value = 5;
                vibratoGain.gain.value = 10;
                vibrato.connect(vibratoGain);
                vibratoGain.connect(osc.frequency);
                
                oscGain.gain.value = 0.3 / frequencies.length;
                oscGain.gain.setValueAtTime(0, audioContext.currentTime);
                oscGain.gain.linearRampToValueAtTime(0.3 / frequencies.length, audioContext.currentTime + 0.1);
                
                osc.connect(oscGain);
                oscGain.connect(gainNode);
                
                osc.start();
                vibrato.start();
                
                // Store reference for cleanup
                if (!currentOscillator) currentOscillator = [];
                currentOscillator.push({ osc, vibrato, gain: oscGain });
            });

            isPlaying = true;
            currentSong = songName;
            updatePlayerDisplay(songName);
            
            // Auto-stop after 5 seconds
            setTimeout(() => {
                if (currentSong === songName) {
                    stopCurrentSong();
                }
            }, 5000);
        }

        function stopCurrentSong() {
            if (currentOscillator && isPlaying) {
                currentOscillator.forEach(({ osc, vibrato, gain }) => {
                    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
                    osc.stop(audioContext.currentTime + 0.1);
                    vibrato.stop(audioContext.currentTime + 0.1);
                });
                currentOscillator = null;
            }
            isPlaying = false;
            currentSong = null;
            updatePlayerDisplay();
        }

        function updatePlayerDisplay(songName = null) {
            const player = document.getElementById('floatingPlayer');
            const songTitle = document.getElementById('currentSong');
            const songDetails = document.getElementById('songDetails');
            const playBtn = document.getElementById('playBtn');

            if (songName) {
                player.classList.add('active');
                songTitle.textContent = songName;
                songDetails.textContent = isPlaying ? 'Now playing...' : 'Click to play';
                playBtn.innerHTML = isPlaying ? '<i class="fas fa-stop"></i>' : '<i class="fas fa-play"></i>';
                generateWaveform();
            } else {
                player.classList.remove('active');
                songTitle.textContent = 'No song selected';
                songDetails.textContent = 'Click on a song to hear a preview';
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
            }
        }

        // Process setlist text and make songs clickable
        function processSetlistText(setlistText) {
            if (!setlistText) return setlistText;

            // Enhanced song detection with common Phish songs
            const songNames = Object.keys(songFrequencies);
            let processedText = setlistText;

            songNames.forEach(song => {
                const regex = new RegExp(`\\b${song.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'gi');
                processedText = processedText.replace(regex, (match) => {
                    return `<span class="song-name" onclick="handleSongClick('${song}')" title="Click to play preview">${match}</span>`;
                });
            });

            // Style set headers
            processedText = processedText.replace(/SET \d+:/g, '<span class="set-header">$&</span>');
            processedText = processedText.replace(/ENCORE:/g, '<span class="encore-header">$&</span>');
            processedText = processedText.replace(/>/g, '<span class="jam-indicator">></span>');

            return processedText;
        }

        function handleSongClick(songName) {
            if (!audioEnabled) {
                alert('Please enable audio first!');
                return;
            }

            if (currentSong === songName && isPlaying) {
                stopCurrentSong();
            } else {
                playSong(songName);
            }

            // Visual feedback
            document.querySelectorAll('.song-name').forEach(el => {
                el.classList.remove('playing');
            });
            
            if (isPlaying) {
                event.target.classList.add('playing');
            }
        }

        // Calculate statistics
        function calculateStats(data) {
            const years = data.map(item => {
                const match = item.date.match(/\d{4}/);
                return match ? parseInt(match[0]) : 0;
            }).filter(year => year > 0);

            const venues = new Set(data.map(item => item.venue));
            const songs = new Set();
            
            data.forEach(item => {
                if (item.setlist) {
                    Object.keys(songFrequencies).forEach(song => {
                        if (item.setlist.includes(song)) {
                            songs.add(song);
                        }
                    });
                }
            });

            document.getElementById('totalShows').textContent = data.length;
            document.getElementById('totalSongs').textContent = songs.size;
            document.getElementById('yearSpan').textContent = years.length ? Math.max(...years) - Math.min(...years) : 0;
            document.getElementById('totalVenues').textContent = venues.size;
        }

        // Load and initialize data
        async function loadSetlistData() {
            try {
                const response = await fetch('phish_setlists.json');
                setlistData = await response.json();
                console.log('Loaded setlist data:', setlistData.length, 'entries');
                
                // Calculate statistics
                calculateStats(setlistData);
                
                // Populate year filter
                const years = [...new Set(setlistData.map(item => {
                    const match = item.date.match(/\d{4}/);
                    return match ? match[0] : null;
                }).filter(Boolean))].sort((a, b) => b - a);
                
                const yearSelect = document.getElementById('yearFilter');
                years.forEach(year => {
                    const option = document.createElement('option');
                    option.value = year;
                    option.textContent = year;
                    yearSelect.appendChild(option);
                });

                initializeDataTable();
            } catch (error) {
                console.error('Error loading setlist data:', error);
            }
        }

        function initializeDataTable() {
            dataTable = $('#setlists').DataTable({
                data: setlistData,
                columns: [
                    { data: 'date', title: 'Date' },
                    { data: 'venue', title: 'Venue' },
                    { data: 'location', title: 'Location' },
                    { 
                        data: 'setlist', 
                        title: 'Setlist',
                        render: function(data) {
                            return `<div class="setlist-cell">${processSetlistText(data)}</div>`;
                        }
                    }
                ],
                pageLength: 25,
                responsive: true,
                order: [[0, 'desc']],
                dom: '<"top"lf>rt<"bottom"ip>',
                language: {
                    search: "Search setlists:",
                    lengthMenu: "Show _MENU_ shows per page",
                    info: "Showing _START_ to _END_ of _TOTAL_ shows",
                    paginate: {
                        first: "First",
                        last: "Last",
                        next: "Next",
                        previous: "Previous"
                    }
                }
            });

            // Add custom filtering
            document.getElementById('yearFilter').addEventListener('change', function() {
                const year = this.value;
                if (year) {
                    dataTable.column(0).search(year).draw();
                } else {
                    dataTable.column(0).search('').draw();
                }
            });

            document.getElementById('venueFilter').addEventListener('input', function() {
                dataTable.column(1).search(this.value).draw();
            });
        }

        // Audio toggle functionality
        document.getElementById('audioToggle').addEventListener('click', function() {
            if (!audioEnabled) {
                initAudio();
                audioEnabled = true;
                this.innerHTML = '<i class="fas fa-volume-up"></i> Audio Enabled';
                this.style.background = 'linear-gradient(45deg, #4ecdc4, #96ceb4)';
            } else {
                audioEnabled = false;
                stopCurrentSong();
                this.innerHTML = '<i class="fas fa-volume-off"></i> Audio Disabled';
                this.style.background = 'linear-gradient(45deg, #ff6b6b, #4ecdc4)';
            }
        });

        // Player controls
        document.getElementById('playBtn').addEventListener('click', function() {
            if (currentSong) {
                if (isPlaying) {
                    stopCurrentSong();
                } else {
                    playSong(currentSong);
                }
            }
        });

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            loadSetlistData();
            generateWaveform();
            
            // Enable audio on first user interaction
            document.addEventListener('click', function() {
                if (audioContext && audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            }, { once: true });
        });

        // Make functions globally available
        window.handleSongClick = handleSongClick;
    </script>
</body>
</html>
